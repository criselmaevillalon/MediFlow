   <!-- ==================== JAVA SCRIPT CORE ENGINE ==================== -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let patientArchive = [];
            try {
                patientArchive = JSON.parse(localStorage.getItem('mediflowArchive')) || [];
            } catch (e) {
                patientArchive = [];
            }

            function updateArchiveCount() {
                const countDisplay = document.getElementById('tabCountDisplay');
                if (countDisplay) {
                    countDisplay.innerText = patientArchive.length;
                }
            }
            updateArchiveCount();

            // CARD 1: Save Patient
            const form1 = document.getElementById('formCard1');
            if (form1) {
                form1.addEventListener('submit', function(event) {
                    // NOTE: Remove event.preventDefault(); if you want to submit directly to PatientServlet!
                    event.preventDefault(); 
                    
                    const name = document.getElementById('pName').value.trim();
                    const history = document.getElementById('pHistory').value.trim();

                    const newRecord = {
                        name: name,
                        history: history,
                        doctor: 'Not Assigned',
                        room: 'Not Assigned',
                        time: 'Not Assigned',
                        billing: 0
                    };

                    patientArchive.push(newRecord);
                    localStorage.setItem('mediflowArchive', JSON.stringify(patientArchive));
                    updateArchiveCount();

                    // FIXED: Added missing quotation marks to prevent script crash
                    alert(✅ Record Created Successfully!\n\nPatient "${name}" has been added to the database archive.);
                    form1.reset();
                });
            }

            // CARD 2: Scheduler
            const form2 = document.getElementById('formCard2');
            if (form2) {
                form2.addEventListener('submit', function(event) {
                    // NOTE: Remove event.preventDefault(); if you want to submit directly to ScheduleServlet!
                    event.preventDefault(); 
                    
                    const doctor = document.getElementById('docName').value.trim();
                    const room = document.getElementById('roomNum').value.trim();
                    const time = document.getElementById('schedTime').value;

                    if (patientArchive.length > 0) {
                        let lastIndex = patientArchive.length - 1;
                        patientArchive[lastIndex].doctor = doctor;
                        patientArchive[lastIndex].room = room;
                        patientArchive[lastIndex].time = time;
                        localStorage.setItem('mediflowArchive', JSON.stringify(patientArchive));
                    }

                    alert(🔒 Schedule Allocation Locked!\n\nPractitioner: ${doctor}\nRoom/Ward: ${room}\nTimestamp: ${time});
                    form2.reset();
                });
            }

            // CARD 3: Billing
            const form3 = document.getElementById('formCard3');
            if (form3) {
                form3.addEventListener('submit', function(event) {
                    // NOTE: Remove event.preventDefault(); if you want to submit directly to BillingServlet!
                    event.preventDefault(); 
                    
                    const consult = parseFloat(document.getElementById('feeConsult').value) || 0;
                    const lab = parseFloat(document.getElementById('feeLab').value) || 0;
                    const med = parseFloat(document.getElementById('feeMed').value) || 0;
                    const room = parseFloat(document.getElementById('feeRoom').value) || 0;

                    const total = consult + lab + med + room;

                    document.getElementById('grandTotalTextDisplay').innerText = total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

                    if (patientArchive.length > 0) {
                        let lastIndex = patientArchive.length - 1;
                        patientArchive[lastIndex].billing = total;
                        localStorage.setItem('mediflowArchive', JSON.stringify(patientArchive));
                    }

                    alert(💰 Financial Billing Calculated!\n\nGrand Total Invoice Compiled: ₱${total.toLocaleString()});
                    form3.reset();
                });
            }

            // PURPLE FOLDER CARD: View Archive manifest records
            const folderCard = document.getElementById('archiveFolderCard');
            if (folderCard) {
                folderCard.addEventListener('click', function(event) {
                    event.preventDefault();
                    if (patientArchive.length === 0) {
                        alert("🗂️ Archived Database Empty:\n\nThere are currently no patient records stored in the log system database.");
                        return;
                    }

                    let logReport = "📁 CURRENT ARCHIVED PATIENT LEDGER MANIFEST:\n\n";
                    patientArchive.forEach((record, idx) => {
                        logReport += ${idx + 1}. Patient Name: ${record.name}\n;
                        logReport +=    Clinical History: ${record.history}\n;
                        logReport +=    Attending Staff: ${record.doctor} | Unit Room: ${record.room}\n;
                        logReport +=    Aggregated Due: ₱${record.billing.toLocaleString()}\n;
                        logReport += ------------------------------------------\n;
                    });

                    alert(logReport);
                });
            }
        });
    </script>
</body>
</html>
