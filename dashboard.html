 <!-- CONSOLE RUNTIME DIAGNOSTIC FOOTER -->
        <div class="app-footer">
            <div>System Layout Architecture: Flow Layout Framework Connected</div>
            <div>Environment Version Status: MediFlow HMS MVP Build v6.0 (File Tab Engine)</div>
        </div>

    </div> <!-- End of app-container -->

    <!-- ==================== JAVA SCRIPT CORE ENGINE ==================== -->
    <script>
        // Temporary active memory cache structure
        let currentRecord = {
            name: '',
            history: '',
            doctor: 'Not Assigned',
            room: 'Not Assigned',
            time: 'Not Assigned',
            billing: 0
        };

        // Initialize and bind LocalStorage to prevent data loss on page browser refreshes
        let patientArchive = JSON.parse(localStorage.getItem('mediflowArchive')) || [];

        // Synchronize and update user interface counter on load
        function updateArchiveCount() {
            document.getElementById('tabCountDisplay').innerText = patientArchive.length;
        }
        updateArchiveCount();

        // MODULE CARD 1: Admissions Processor (Triggers automatic archival entry)
        function savePatient(event) {
            event.preventDefault();
            
            const nameInput = document.getElementById('pName').value.trim();
            const historyInput = document.getElementById('pHistory').value.trim();

            if (!nameInput || !historyInput) {
                alert("⚠️ Process Incomplete: Please complete the Patient Admissions Record before saving.");
                return;
            }

            // 1. Write values to active working runtime layer
            currentRecord.name = nameInput;
            currentRecord.history = historyInput;

            // 2. FORWARD DIRECTLY AND AUTOMATICALLY TO PERSISTENT COMPLIANT ARCHIVE
            patientArchive.push({ ...currentRecord });
            localStorage.setItem('mediflowArchive', JSON.stringify(patientArchive));

            // 3. Increment system metric badges in viewport
            updateArchiveCount();

            alert(✅ Success: Record for "${nameInput}" has been automatically archived!\n\n(You can now proceed to update allocation logs in Card 2 or compile financial balance tables in Card 3).);
            
            // Clean active forms safely
            event.target.reset();
        }

        // MODULE CARD 2: Scheduler Runtime Interface
        function confirmSchedule(event) {
            event.preventDefault();
            if (patientArchive.length === 0) {
                alert("⚠️ Operation Rejected: Initialize an active Patient Admissions Record in Card 1 first.");
                return;
            }

            // Reference last modified row element
            let lastIndex = patientArchive.length - 1;
            patientArchive[lastIndex].doctor = document.getElementById('docName').value;
            patientArchive[lastIndex].room = document.getElementById('roomNum').value;
            patientArchive[lastIndex].time = document.getElementById('schedTime').value;

            localStorage.setItem('mediflowArchive', JSON.stringify(patientArchive));
            alert(🔒 Schedule Allocation Locked successfully for ${patientArchive[lastIndex].name}!);
            event.target.reset();
        }

        // MODULE CARD 3: Billing Metric Engine
        function calculateBilling(event) {
            event.preventDefault();
            if (patientArchive.length === 0) {
                alert("⚠️ Operation Rejected: Initialize an active Patient Admissions Record in Card 1 first.");
                return;
            }

            const consult = parseFloat(document.getElementById('feeConsult').value) || 0;
            const lab = parseFloat(document.getElementById('feeLab').value) || 0;
            const med = parseFloat(document.getElementById('feeMed').value) || 0;
            const room = parseFloat(document.getElementById('feeRoom').value) || 0;

            const grandTotal = consult + lab + med + room;

            // Compute ledger properties and write to active element row
            let lastIndex = patientArchive.length - 1;
            patientArchive[lastIndex].billing = grandTotal;

            localStorage.setItem('mediflowArchive', JSON.stringify(patientArchive));
            alert(💰 Grand Total Invoice Compiled for ${patientArchive[lastIndex].name}: ₱${grandTotal.toLocaleString()});
            event.target.reset();
        }

        // RETRIEVAL PORTAL: Click Event Endpoint for Purple Module Tab
        function openArchiveDatabase() {
            if (patientArchive.length === 0) {
                alert("🗂️ Database Empty: There are no archived entries to view yet.");
                return;
            }

            // Build human-readable clinical dataset output string
            let archiveList = "📁 RETRIEVED ARCHIVED PATIENT FILES:\n\n";
            patientArchive.forEach((patient, index) => {
                archiveList += ${index + 1}. Patient Name: ${patient.name}\n;
                archiveList +=    Clinical History: ${patient.history}\n;
                archiveList +=    Practitioner: ${patient.doctor} | Unit Room: ${patient.room}\n;
                archiveList +=    Aggregated Balances: ₱${patient.billing.toLocaleString()}\n;
                archiveList += ------------------------------------------\n;
            });

            alert(archiveList);
            console.log("Database Array Content Export:", patientArchive);
        }
    </script>
</body>
</html>
