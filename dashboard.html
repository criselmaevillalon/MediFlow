<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediFlow HMS - MVP Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h2 { color: #2980b9; margin-top: 0; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #219653; }
        
        /* Modal Popup System Overlay Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 12% auto; padding: 30px; border-radius: 8px; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: left; }
        .item { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px; }
        .close-btn { width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; font-size: 16px; }
        .close-btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>MediFlow Hospital Management System (MVP)</h1>
    <p>Logged in: Authorized Personnel (Flora, Apayao Facility)</p>

    <div class="grid">
        <!-- PILLAR 1: PATIENT RECORD MANAGEMENT -->
        <div class="card">
            <h2>1. Patient Records</h2>
            <form onsubmit="savePatient(event)">
                <label>Patient Name:</label>
                <input type="text" id="pName" required placeholder="e.g., Juan Dela Cruz">
                
                <label>Medical History / Diagnostics:</label>
                <textarea id="pHistory" rows="4" required placeholder="Enter symptoms, allergies, or diagnosis..."></textarea>
                
                <button type="submit">Save Patient Record</button>
            </form>
        </div>

        <!-- PILLAR 2: ROOM & DOCTOR SCHEDULING -->
        <div class="card">
            <h2>2. Room & Doctor Scheduler</h2>
            <form onsubmit="confirmSchedule(event)">
                <label>Assign Doctor:</label>
                <input type="text" id="docName" required placeholder="Type doctor's name...">

                <label>Assign Room / Ward:</label>
                <input type="text" id="roomNum" required placeholder="Type room number or ward...">

                <label>Appointment Date & Time:</label>
                <input type="datetime-local" id="schedTime" required>

                <button type="submit" style="background-color: #3498db;">Confirm Schedule</button>
            </form>
        </div>

        <!-- PILLAR 3: MEDICAL BILLING MANAGEMENT -->
        <div class="card">
            <h2>3. Automated Billing</h2>
            <form onsubmit="calculateBilling(event)">
                <label>Consultation Fee (₱):</label>
                <input type="number" id="feeConsult" value="0" min="0" required>

                <label>Laboratory Fees (₱):</label>
                <input type="number" id="feeLab" value="0" min="0" required>

                <label>Medicine Costs (₱):</label>
                <input type="number" id="feeMed" value="0" min="0" required>

                <label>Room Charges (₱):</label>
                <input type="number" id="feeRoom" value="0" min="0" required>

                <button type="submit" style="background-color: #e67e22;">Calculate & Issue Invoice</button>
            </form>
        </div>
    </div>
</div>

<!-- CENTRAL DISPLAY MODAL POPUP -->
<div id="displayModal" class="modal">
    <div class="modal-content" id="modalBorder">
        <h2 style="text-align:center; margin-top:0;" id="modalHeader">System Notification</h2>
        <p style="text-align:center; font-size:12px; color:#7f8c8d; margin-top:-10px;">MediFlow Facility Cloud Service</p>
        <hr>
        <div id="modalBody"></div>
        <button class="close-btn" id="modalBtn" onclick="closeModal()">OK</button>
    </div>
</div>

<script>
    // Module 1 Rendering
    function savePatient(e) {
        e.preventDefault();
        var name = document.getElementById("pName").value;
        var history = document.getElementById("pHistory").value;
        
        document.getElementById("modalBorder").style.borderTop = "10px solid #27ae60";
        document.getElementById("modalHeader").innerText = "✔ Patient Record Saved";
        document.getElementById("modalHeader").style.color = "#27ae60";
        
        document.getElementById("modalBody").innerHTML = 
            "<div class='item'><span><strong>Patient Name:</strong></span> <span>" + name + "</span></div>" +
            "<div class='item'><span><strong>Medical History:</strong></span> <span>" + history + "</span></div>" +
            "<div class='item'><span><strong>Status:</strong></span> <span style='color:#27ae60; font-weight:bold;'>Logged Successfully</span></div>";
            
        document.getElementById("modalBtn").style.backgroundColor = "#27ae60";
        document.getElementById("displayModal").style.display = "block";
    }

    // Module 2 Rendering
    function confirmSchedule(e) {
        e.preventDefault();
        var doc = document.getElementById("docName").value;
        var room = document.getElementById("roomNum").value;
        var time = document.getElementById("schedTime").value.replace("T", " ");
        
        document.getElementById("modalBorder").style.borderTop = "10px solid #3498db";
        document.getElementById("modalHeader").innerText = "📅 Appointment Scheduled";
        document.getElementById("modalHeader").style.color = "#3498db";
        
        document.getElementById("modalBody").innerHTML = 
            "<div class='item'><span><strong>Assigned Doctor:</strong></span> <span>" + doc + "</span></div>" +
            "<div class='item'><span><strong>Location:</strong></span> <span>" + room + "</span></div>" +
            "<div class='item'><span><strong>Date/Time:</strong></span> <span>" + time + "</span></div>";
            
        document.getElementById("modalBtn").style.backgroundColor = "#3498db";
        document.getElementById("displayModal").style.display = "block";
    }

    // Module 3 Core Formula-Driven Billing Calculation
    function calculateBilling(e) {
        e.preventDefault();
        var consult = parseFloat(document.getElementById("feeConsult").value) || 0;
        var lab = parseFloat(document.getElementById("feeLab").value) || 0;
        var med = parseFloat(document.getElementById("feeMed").value) || 0;
        var room = parseFloat(document.getElementById("feeRoom").value) || 0;
        
        var total = consult + lab + med + room;
        
        document.getElementById("modalBorder").style.borderTop = "10px solid #e67e22";
        document.getElementById("modalHeader").innerText = "🧾 MediFlow Invoice Issued";
        document.getElementById("modalHeader").style.color = "#e67e22";
        
        document.getElementById("modalBody").innerHTML = 
            "<div class='item'><span>Consultation Fee:</span> <strong>₱" + consult.toFixed(2) + "</strong></div>" +
            "<div class='item'><span>Laboratory Fee:</span> <strong>₱" + lab.toFixed(2) + "</strong></div>" +
            "<div class='item'><span>Medicine Costs:</span> <strong>₱" + med.toFixed(2) + "</strong></div>" +
            "<div class='item'><span>Room Charges:</span> <strong>₱" + room.toFixed(2) + "</strong></div>" +
            "<hr>" +
            "<div class='item' style='font-size:18px;'><span><strong>Grand Total:</strong></span> <span style='color: #e67e22;'><strong>₱" + total.toFixed(2) + "</strong></span></div>";
            
        document.getElementById("modalBtn").style.backgroundColor = "#e67e22";
        document.getElementById("displayModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("displayModal").style.display = "none";
    }
</script>

</body>
</html>
